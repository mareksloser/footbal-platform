services:
  club_instagram.post_redirect:
    class: Drupal\club_instagram\EventSubscriber\PostRedirectSubscriber
    arguments: ['@current_route_match', '@current_user']
    tags:
      - { name: event_subscriber }

  club_instagram.panel_builder:
    class: Drupal\club_instagram\PanelBuilder
    arguments: ['@entity_type.manager', '@entity_field.manager', '@config.factory', '@file_url_generator', '@current_route_match', '@club_core.team_context']
