services:
  skbl_core.team_context:
    class: Drupal\skbl_core\TeamContext
    arguments: ['@current_route_match', '@request_stack', '@entity_type.manager']

  cache_context.team:
    class: Drupal\skbl_core\Cache\TeamCacheContext
    arguments: ['@skbl_core.team_context']
    tags:
      - { name: cache.context }

  skbl_core.team_param_converter:
    class: Drupal\skbl_core\ParamConverter\TeamParamConverter
    arguments: ['@skbl_core.team_context', '@entity_type.manager']
    tags:
      - { name: paramconverter }

  skbl_core.contacts_builder:
    class: Drupal\skbl_core\ContactsBuilder
    arguments: ['@skbl_core.team_context']
