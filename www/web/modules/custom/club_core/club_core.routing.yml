club_core.team_detail:
  path: '/tym/{node}/o-tymu'
  defaults:
    _controller: '\Drupal\club_core\Controller\TeamDetailController::view'
    _title_callback: '\Drupal\club_core\Controller\TeamDetailController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: club_team

club_core.contacts:
  path: '/kontakty'
  defaults:
    _controller: '\Drupal\club_core\Controller\ContactsController::page'
    _title: 'Kontakty'
  requirements:
    _permission: 'access content'

club_core.ics_all:
  path: '/kalendar.ics'
  defaults:
    _controller: '\Drupal\club_core\Controller\IcsController::all'
  requirements:
    _permission: 'access content'

club_core.ics_team:
  path: '/kalendar/{team}.ics'
  defaults:
    _controller: '\Drupal\club_core\Controller\IcsController::team'
  requirements:
    _permission: 'access content'
    team: '[a-z0-9-]+'
  options:
    parameters:
      team:
        type: club_team

club_core.mvr_video_feed:
  path: '/api/mvr/videos.json'
  defaults:
    _controller: '\Drupal\club_core\Controller\VideoFeedController::feed'
  requirements:
    _permission: 'access content'

club_core.ics_node:
  path: '/kalendar/udalost/{node}.ics'
  defaults:
    _controller: '\Drupal\club_core\Controller\IcsController::single'
  requirements:
    _entity_access: 'node.view'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node
